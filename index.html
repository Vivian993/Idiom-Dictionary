<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 活力成語字卡 🌟</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            background-image: radial-gradient( circle farthest-corner at 10% 20%,  rgba(255,209,67,1) 0%, rgba(255,145,83,1) 90% );
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 3D 翻轉卡片核心 CSS */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden; /* Safari */
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        .card-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        .card-inner.flipped {
            transform: rotateY(180deg);
        }

        .btn-bounce {
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-bounce:active {
            transform: scale(0.92);
        }
        
        /* 隱藏捲軸但保持可滾動 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 防止點擊時意外選取文字阻礙翻面 */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }

        /* 已學習標籤動畫 */
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop-in {
            animation: popIn 0.4s ease-out forwards;
        }

        /* 注音標示樣式 */
        ruby {
            ruby-align: center;
        }
        rt {
            font-size: 0.35em;
            color: #6b7280; /* Tailwind gray-500 */
            font-weight: 700;
            letter-spacing: 0;
            transform: translateY(-0.1em);
        }
        /* 背面注音稍微小一點 */
        #card-idiom-back rt {
            font-size: 0.45em;
        }
        /* 成就徽章的注音再大一點點以利閱讀 */
        #learned-list rt {
            font-size: 0.5em;
            transform: translateY(0);
        }
    </style>
</head>
<body class="flex flex-col items-center p-4 sm:p-8">

                <h2 class="text-4xl font-black text-orange-500 mb-4">太棒了！</h2>

            </div>

                              <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z" />
                            </svg>
                        </button>
                        
                        <h2 id="card-idiom" class="text-6xl sm:text-7xl font-black text-gray-800 mb-6 tracking-widest text-center drop-shadow-sm">成語</h2>

                            </svg>

            { i: "揭竿而起", m: "比喻武裝起義。", s: "逼上梁山、起義造反", a: "安分守己、逆來順受", z: "ㄐㄧㄝ ㄍㄢ ㄦˊ ㄑㄧˇ" },
            { i: "結草銜環", m: "比喻感恩報德，至死不忘。", s: "感恩圖報、沒齒難忘", a: "忘恩負義、恩將仇報", z: "ㄐㄧㄝˊ ㄘㄠˇ ㄒㄧㄢˊ ㄏㄨㄢˊ" },
            { i: "光陰荏苒", m: "時間漸漸過去。", s: "日月如梭、白駒過隙", a: "度日如年、度日如歲", z: "ㄍㄨㄤ ㄧㄣ ㄖㄣˇ ㄖㄢˇ" }
        ];

        let unlearnedIdioms = [...allIdiomsData];
        let learnedIdioms = [];
        let currentIndex = 0;
        let isFlipped = false;
        
        let toneSynth = null;
        let polySynth = null;
        let isAudioInitialized = false;

        // 將成語字串與注音字串轉換為含 <ruby> 標籤的 HTML
        function renderZhuyinHTML(text, zhuyinStr) {
            if (!zhuyinStr) return text;
            const chars = text.split('');
            const zhuyins = zhuyinStr.split(' ');
            let html = '';
            for (let j = 0; j < chars.length; j++) {
                if (zhuyins[j]) {
                    html += `<ruby>${chars[j]}<rt>${zhuyins[j]}</rt></ruby>`;
                } else {
                    html += chars[j];
                }
            }
            return html;
        }

        // DOM 元素參考
        const cardContainer = document.getElementById('card-container');
        const cardInner = document.getElementById('card-inner');
        const emptyState = document.getElementById('empty-state');
        const controlsContainer = document.getElementById('controls-container');
        
        const frontIdiomText = document.getElementById('card-idiom');
        const backIdiomText = document.getElementById('card-idiom-back');
        const meaningText = document.getElementById('card-meaning');
        const synonymsText = document.getElementById('card-synonyms');
        const antonymsText = document.getElementById('card-antonyms');
        
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        
        const learnedList = document.getElementById('learned-list');
        const learnedEmptyMsg = document.getElementById('learned-empty-msg');
        const learnedCountBadge = document.getElementById('learned-count-badge');

        function initAudio() {
            if (!isAudioInitialized) {
                // 單音合成器 (用於普通按鈕)
                toneSynth = new Tone.MembraneSynth({
                    pitchDecay: 0.05,
                    octaves: 4,
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.01, decay: 0.2, sustain: 0.1, release: 0.8 }
                }).toDestination();
                toneSynth.volume.value = -12; 

                // 和弦合成器 (用於「學會了」過關音效)
                polySynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.05, decay: 0.1, sustain: 0.3, release: 1 }
                }).toDestination();
                polySynth.volume.value = -10;

                isAudioInitialized = true;
            }
        }

        function playPopSound(high = false) {
            if (!isAudioInitialized) return;
            try { toneSynth.triggerAttackRelease(high ? "C5" : "G4", "8n"); } catch(e) {}
        }

        function playFlipSound() {
            if (!isAudioInitialized) return;
            try {
                let osc = new Tone.Oscillator(400, "sine").toDestination();
                osc.start().stop("+0.05");
                osc.volume.value = -25;
            } catch(e) {}
        }

        function playSuccessSound() {
            if (!isAudioInitialized) return;
            try {
                // 播放一個開心的琶音和弦
                const now = Tone.now();
                polySynth.triggerAttackRelease(["C4", "E4", "G4"], "8n", now);
                polySynth.triggerAttackRelease(["C5"], "4n", now + 0.15);
            } catch(e) {}
        }

        function updateCardDisplay() {
            // 檢查是否已全部學完
            if (unlearnedIdioms.length === 0) {
                cardContainer.style.display = 'none';
                controlsContainer.style.display = 'none';
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                updateProgress();
                return;
            }

            // 確保索引在安全範圍
            if (currentIndex >= unlearnedIdioms.length) {
                currentIndex = 0;
            } else if (currentIndex < 0) {
                currentIndex = unlearnedIdioms.length - 1;
            }

            const data = unlearnedIdioms[currentIndex];
            
            // 更新文字內容 (包含注音 HTML)
            frontIdiomText.innerHTML = renderZhuyinHTML(data.i, data.z);
            backIdiomText.innerHTML = renderZhuyinHTML(data.i, data.z);
            
            meaningText.textContent = data.m;
            synonymsText.textContent = data.s;
            antonymsText.textContent = data.a;
            
            updateProgress();
            
            // 確保切換時是正面
            if (isFlipped) {
                isFlipped = false;
                cardInner.classList.remove('flipped');
            }
        }

        function updateProgress() {
            const total = allIdiomsData.length;
            const learnedCount = learnedIdioms.length;
            
            progressText.textContent = `已學習進度: ${learnedCount} / ${total}`;
            const progressPercent = (learnedCount / total) * 100;
            progressBar.style.width = `${progressPercent}%`;
            
            learnedCountBadge.textContent = `${learnedCount} 顆星`;
        }

        function toggleFlip(event) {
            // 如果有點擊事件，阻止冒泡以免重複觸發
            if(event) event.stopPropagation(); 
            initAudio(); 
            playFlipSound();
            isFlipped = !isFlipped;
            if (isFlipped) {
                cardInner.classList.add('flipped');
            } else {
                cardInner.classList.remove('flipped');
            }
        }

        function nextCard() {
            if(unlearnedIdioms.length === 0) return;
            initAudio();
            playPopSound(true);
            currentIndex++;
            handleTransitionUpdate();
        }

        function prevCard() {
            if(unlearnedIdioms.length === 0) return;
            initAudio();
            playPopSound(false);
            currentIndex--;
            handleTransitionUpdate();
        }

        function handleTransitionUpdate() {
            if(isFlipped) {
                isFlipped = false;
                cardInner.classList.remove('flipped');
                setTimeout(updateCardDisplay, 250);
            } else {
                updateCardDisplay();
            }
        }

        function markAsLearned() {
            if (unlearnedIdioms.length === 0) return;
            initAudio();
            playSuccessSound();
            
            // 取得目前的成語
            const learnedItem = unlearnedIdioms[currentIndex];
            
            // 加入已學習陣列
            learnedIdioms.push(learnedItem);
            
            // 從未學習陣列移除
            unlearnedIdioms.splice(currentIndex, 1);
            
            // 更新右側「已解鎖成就區」的 UI
            renderLearnedBadge(learnedItem);
            
            // 隱藏空狀態提示
            if(learnedEmptyMsg) {
                learnedEmptyMsg.style.display = 'none';
            }

            // 更新左側卡片
            handleTransitionUpdate();
        }

        function renderLearnedBadge(item) {
            const badge = document.createElement('div');
            // 使用 Tailwnid 建立可愛的徽章標籤
            badge.className = "animate-pop-in bg-white text-orange-600 font-bold px-4 py-2 rounded-xl shadow-[0_3px_0_rgba(251,146,60,0.5)] border-2 border-orange-100 flex items-center gap-1 cursor-help";
            
            // 在標籤上也顯示注音
            const badgeHTML = renderZhuyinHTML(item.i, item.z);
            badge.innerHTML = `✅ <span class="tracking-widest">${badgeHTML}</span>`;
            
            // 加入簡單的點擊提示功能 (原生 Title 屬性)
            badge.title = `${item.m}\n同義：${item.s}\n反義：${item.a}`;
            
            // 加入點擊發音
            badge.onclick = () => {
                initAudio();
                playPopSound(true);
                readTextAloud(item.i);
            };

            learnedList.appendChild(badge);
        }

        function playIdiomAudio(event) {
            event.stopPropagation(); // 阻止卡片翻面
            initAudio();
            playPopSound(true);
            
            if(unlearnedIdioms.length > 0) {
                readTextAloud(unlearnedIdioms[currentIndex].i);
            }
        }

        function playMeaningAudio(event) {
            event.stopPropagation(); // 阻止卡片翻面
            initAudio();
            playPopSound(true);
            
            if(unlearnedIdioms.length > 0) {
                const item = unlearnedIdioms[currentIndex];
                // 組合朗讀文字，讓語意更順暢，並包含同義詞與反義詞
                const textToRead = `${item.i}的解釋是：${item.m}。同義詞有：${item.s}。反義詞有：${item.a}。`;
                readTextAloud(textToRead);
            }
        }

        function readTextAloud(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 中斷正在唸的
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';
                utterance.rate = 0.8; // 稍微放慢
                utterance.pitch = 1.2; // 稍微提高音調
                
                window.speechSynthesis.speak(utterance);
            } else {
                console.log("此瀏覽器不支援語音朗讀");
            }
        }

        function resetAll() {
            unlearnedIdioms = [...allIdiomsData];
            learnedIdioms = [];
            currentIndex = 0;
            
            // 重置 UI
            learnedList.innerHTML = '';
            learnedList.appendChild(learnedEmptyMsg);
            learnedEmptyMsg.style.display = 'block';
            
            cardContainer.style.display = 'block';
            controlsContainer.style.display = 'flex';
            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');
            
            updateCardDisplay();
        }

        // 初始載入
        window.onload = () => {
            updateCardDisplay();
            
            // 鍵盤快速鍵支援
            document.addEventListener('keydown', (e) => {
                // 如果已經學完，就不需要鍵盤操作卡片
                if(unlearnedIdioms.length === 0) return;
                
                if (e.key === 'ArrowRight') nextCard();
                if (e.key === 'ArrowLeft') prevCard();
                // 空白鍵或 Enter 翻面 (避免在其他聚焦元素上觸發)
                if (e.key === ' ' && e.target === document.body) {
                    e.preventDefault();
                    toggleFlip();
                }
            });
        };
    </script>
</body>
</html>
